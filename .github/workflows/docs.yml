name: Docs

# Builds the user guide (mkdocs.yml) on every push and pull request that touches it, and
# publishes it to GitHub Pages from main. Pages must be set to "GitHub Actions" as its
# source (Settings, Pages, Build and deployment).
on:
  push:
    branches: [main]
    paths: [docs/**, docs-site/**, mkdocs.yml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, docs-site/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
