name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check out googletest for the F Prime unit-test build
        run: git -C lib/fprime submodule update --init --depth 1 googletest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install F Prime tools and fprime-sse
        run: pip install -r lib/fprime/requirements.txt ./python pytest

      - name: Python tests (manifest, patching, bridge client, generator)
        run: pytest python/tests

      - name: Generated examples are up to date
        run: |
          fprime-sse generate examples/linux-demo/LinuxDemo/sse.yaml --check
          fprime-sse generate examples/vx-demo/VxDemo/sse.yaml --check

      - name: C++ unit tests for the SSE core
        run: |
          fprime-util generate --ut
          cd Sse/Core && fprime-util check -j"$(nproc)"

      - name: Build the simulated LinuxDemo
        working-directory: examples/linux-demo/sse/LinuxDemo
        run: |
          fprime-util generate
          fprime-util build -j"$(nproc)"

      - name: End-to-end tests, LinuxDemo
        run: |
          D=examples/linux-demo/sse/LinuxDemo
          pytest tests/e2e/test_linux_demo.py -p fprime_sse.pytest_plugin \
            --sse-deployment "$D" --sse-gds \
            --dictionary "$D/build-artifacts/Linux/LinuxDemo/dict/LinuxDemoTopologyDictionary.json"

      - name: Build the simulated VxDemo (VxWorks deployment, no VxWorks toolchain)
        working-directory: examples/vx-demo/sse/VxDemo
        run: |
          fprime-util generate
          fprime-util build -j"$(nproc)"

      - name: End-to-end tests, VxDemo
        run: |
          D=examples/vx-demo/sse/VxDemo
          pytest tests/e2e/test_vx_demo.py -p fprime_sse.pytest_plugin \
            --sse-deployment "$D" --sse-gds \
            --dictionary "$D/build-artifacts/Linux/VxDemo/dict/VxDemoTopologyDictionary.json"

      - name: Keep simulation logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sse-logs
          path: examples/*/sse/*/sse-logs
