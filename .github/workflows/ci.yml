name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check out googletest for the F Prime unit-test build
        run: git -C lib/fprime submodule update --init --depth 1 googletest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install F Prime tools and fprime-wsts
        run: pip install -r lib/fprime/requirements.txt -e ./python pytest

      - name: Python tests (manifest, patching, bridge client, generator)
        run: pytest python/tests

      - name: Generated example is up to date
        run: fprime-wsts generate examples/mission-sim/wsts-system.yaml --check

      - name: The host has what the example's simulated build needs
        run: fprime-wsts check-host examples/mission-sim/wsts-system.yaml

      - name: C++ unit tests for the WSTS core
        run: |
          fprime-util generate --ut
          cd Wsts/Core && fprime-util check -j"$(nproc)"

      - name: Build the simulated Mission system (a VxWorks and a Linux computer joined by a hub)
        run: |
          for element in cdh payload; do
            (cd examples/mission-sim/wsts/Mission/$element && fprime-util generate && fprime-util build -j"$(nproc)")
          done

      - name: End-to-end tests, Mission system
        run: |
          D=examples/mission-sim/wsts/Mission
          pytest tests/e2e -p fprime_wsts.pytest_plugin \
            --wsts-system "$D" --wsts-gds \
            --dictionary "$D/wsts-logs/MissionDictionary.json"

      - name: Keep simulation logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wsts-logs
          path: |
            examples/mission-sim/wsts/Mission/wsts-logs
            !examples/mission-sim/wsts/Mission/wsts-logs/*Dictionary*.json
