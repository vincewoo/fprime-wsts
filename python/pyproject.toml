[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fprime-sse"
version = "0.1.0"
description = "Software simulation environment toolkit for F Prime deployments"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.scripts]
fprime-sse = "fprime_sse.cli:main"

[tool.setuptools.packages.find]
include = ["fprime_sse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
