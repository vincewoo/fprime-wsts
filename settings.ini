; The toolkit is an F Prime library. This file also makes the repository root a project,
; so the toolkit's own unit tests can be built and run with fprime-util:
;   fprime-util generate --ut && fprime-util check
[fprime]
framework_path: ./lib/fprime
project_root: .
default_cmake_options: FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
