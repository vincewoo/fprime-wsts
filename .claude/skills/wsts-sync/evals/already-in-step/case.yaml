schema_version: "1.1"
name: already-in-step
expected_outcome: |
  The agent checks whether the simulation project is in step with the flight project
  (the drift check, or generate --check) and reports that it is: generating again changes
  nothing, with the flight commit and toolkit commit it is in step with. It changes no
  files and does not regenerate or rebuild for nothing. It may mention the toolkit pin and
  offer CI, but makes neither change unasked.
context:
  scaffold_script: place-files.sh
---
tags: [wsts-sync]
max_turns: 40
timeout_seconds: 1200
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
---
