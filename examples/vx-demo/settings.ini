; SSE toolkit example: a deployment targeting VxWorks (downloadable kernel module).
; It cannot be configured or built without the Wind River toolchain; the simulated
; deployment generated from it builds on a plain Linux host.
[fprime]
framework_path: ../../lib/fprime
project_root: .
library_locations: ../../lib/fprime-vxworks
default_toolchain: vxworks
default_cmake_options: FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
    VX_TARGET_TYPE=DKM
    FPRIME_PLATFORM=VxWorks
