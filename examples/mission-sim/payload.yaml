# WSTS manifest for Payload, the Linux computer of the Mission system, reached only
# through the hub.
#
# The timer, I2C, SPI, UART and GPIO drivers are found and replaced from the surrogate
# catalogs: this project's (wsts-catalog.yaml) first, then the toolkit's. The Ethernet
# driver to the Cdh computer is replaced because wsts-system.yaml ends a link at it. The
# manifest adds what cannot be inferred: which device models sit behind the buses.
project: ../mission
deployment: Payload

# Project surrogates: a mirror of Drv.LinuxGpioDriver for the heater and switch pins. It
# keeps the flight driver's events in the dictionary and its pin-mode checks, where the
# toolkit's general-purpose Wsts.SimGpio would accept any use of a pin.
catalogs:
  - wsts-catalog.yaml

# The register interface the FPGA driver (Components.FpgaMonitor) reads and writes through
# is a component of sensor-lib, which no catalog knows: it is named here. Wsts.SimRegister
# is written for it with its port names and types, and the driver above runs as in flight.
#
# Surrogates/SimRegisterInterface is a mirror of the same component, written by hand: it
# keeps the flight component's REG_READ and REG_WRITE commands and their events in the
# dictionary. To use it, name Sim.SimRegisterInterface here instead.
substitute:
  - instance: fpgaRegs
    with: Wsts.SimRegister

models:
  # IMU at I2C address 0x68: a model of this project (Models/), set in g
  - name: imu
    class: Sim::ImuModel
    header: Models/ImuModel.hpp
    endpoint: i2cBus
    kind: i2c
    address: 0x68

  # Power monitor on the same bus at 0x40: the toolkit's register map, 14.0 V and 500 mA
  - name: power
    class: Wsts::RegisterMapI2c
    endpoint: i2cBus
    kind: i2c
    address: 0x40
    params:
      "0x02": "0x6D 0x60"
      "0x04": "0x01 0xF4"

  # The instrument's converter on SPI: the toolkit's loopback model shifts back what it
  # is sent, which the flight component reads as a conversion of 0
  - name: adc
    class: Wsts::LoopbackSpi
    endpoint: spiBus
    kind: spi

  # The FPGA's housekeeping block behind fpgaRegs: the toolkit's register file, with the
  # block's registers and its frame interrupt once a second (20 ticks at 20 Hz)
  - name: fpga
    class: Wsts::RegisterFile
    endpoint: fpgaRegs
    kind: register
    params:
      "reg.0x00": "0xF00D0001"   # identity, read only
      "mask.0x00": "0"
      "reg.0x04": "0"            # interrupt status, write 1 to clear
      "w1c.0x04": "1"
      "reg.0x08": "0"            # frame count
      "reg.0x0C": "215"          # temperature: 21.5 degrees Celsius
      "reg.0x10": "0"            # heartbeat
      "reg.0x14": "0"            # LEDs
      "irq.number": "1"
      "irq.period": "20"
      "irq.status": "0x04"
      "irq.bits": "0x1"          # frame ready

  # Serial temperature sensor reporting once a second (20 ticks at 20 Hz)
  - name: tempSensor
    class: Wsts::ScriptedByteStream
    endpoint: sensorUart
    kind: bytestream
    params:
      text: "$TEMP,21.5\n"
      period: "20"

cmake:
  # The camera's SDK exists for the flight board only. Components/Imager has a stub of the
  # camera for its unit tests, under if (BUILD_TESTING): that module alone is read with
  # BUILD_TESTING set. sensor-lib's unit conversions also have a variant for unit tests,
  # and keep their real one: the topology code needs the include directory it exports.
  stub_variants: [Components/Imager]
  # sensor-lib uses memcpy without including <cstring>: the flight compiler's standard
  # library brings it in, the host's does not
  cxx_flags:
    lib/sensor-lib/SensorLib/Units: ["-include cstring"]
  # Headers of the board's sysroot that a workstation lacks (host/include)
  include_early: [host.cmake]
  # This project's library.cmake builds only the modules this element uses
  cache:
    MISSION_SIM_MODULES: [Models, Surrogates/SimLinuxGpio, Surrogates/SimRegisterInterface]
  # The model's module, for the generated set-up that creates it
  depends: [Models]

bridge: tcp:50101
