# yaml-language-server: $schema=../../schemas/wsts-system.schema.json
# WSTS system manifest for Mission: two flight computers joined by an F Prime hub.
#
#   ground  <--TCP-->  Cdh (VxWorks)  <==hub over Ethernet==>  Payload (Linux)
#
# Each element is an ordinary deployment of the flight project ../mission, with its own
# manifest in this simulation project. This file adds what makes them one system: which
# element the ground talks to, the link between them, and the range of IDs that reaches
# each element.
system: Mission

# The GDS connects to this element, with the merged dictionary of both
ground: cdh

elements:
  cdh:
    manifest: cdh.yaml
    ids: [0x00000000, 0x1FFFFFFF]
  payload:
    manifest: payload.yaml
    # Cdh's command splitter sends opcodes from 0x20000000 through the hub
    ids: [0x20000000, 0x2FFFFFFF]

links:
  # Ends at the Ethernet driver instance of each element. Those instances are replaced by
  # byte stream surrogates, and the link carries what flight software sends between them.
  - name: hub
    a: cdh.hubDriver
    b: payload.hubDriver

# A plant stepped with the system in lockstep (docs/dynamics.md): the thermal model of
# Payload's heated panel (plants/thermal.py). Between two instants the conductor reads the
# heater pin flight software drives, steps the model, and gives flight software the panel's
# temperature three ways: the serial sensor's message, the FPGA's temperature register (in
# tenths of a degree), and the over-temperature switch, which closes above 45 C and opens
# again below 40 C. The panel sits at its surroundings' 21.5 C until the heater is turned on
# (Payload.heater.HEATER_SET); then the switch trips, and HeaterControl turns it off again.
dynamics:
  - name: thermal
    python: plants/thermal.py
    params: {C: 5.0, P: 10.0, G: 0.1, T_env: 21.5, T0: 21.5}
    inputs:
      heater: {element: payload, gpio: heaterPin}
    outputs:
      T:
        - {element: payload, model: tempSensor, key: text, format: "$TEMP,{:.1f}\n"}
        - {element: payload, model: fpga, key: reg.0x0C, scale: 10, round: true}
        - {element: payload, gpio: switchPin, above: 45, hysteresis: 5}
