# WSTS manifest for the Cdh deployment: the ground-facing element of the HubDemo system.
#
# The timer is replaced from the surrogate catalog. The Ethernet driver to the payload
# computer is not named here either: it is replaced because wsts-system.yaml ends a link
# at it.
deployment: Cdh

# The ground link stays a real TCP client so the GDS connects exactly as in flight
keep:
  - comDriver
