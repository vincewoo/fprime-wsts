# WSTS system manifest for HubDemo: two flight computers joined by an F Prime hub.
#
#   ground  <--TCP-->  Cdh  <==hub over Ethernet==>  Payload
#
# Each element is an ordinary deployment with its own manifest. This file adds what makes
# them one system: which element the ground talks to, the links between elements, and the
# range of IDs that reaches each element.
system: HubDemo

# The GDS connects to this element, with the merged dictionary of all of them
ground: cdh

elements:
  cdh:
    manifest: Cdh/wsts.yaml
    ids: [0x00000000, 0x1FFFFFFF]
  payload:
    manifest: Payload/wsts.yaml
    # Cdh's command splitter sends opcodes from 0x20000000 through the hub
    ids: [0x20000000, 0x2FFFFFFF]

links:
  # Ends at the Ethernet driver instance of each element. Those instances are replaced by
  # byte stream surrogates, and the link carries what flight software sends between them.
  - name: hub
    a: cdh.hubDriver
    b: payload.hubDriver
