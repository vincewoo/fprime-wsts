; WSTS toolkit example: a VxWorks deployment built from subtopologies. Its serial driver is
; inside a subtopology supplied by a project library (lib/sensor-lib), and the project
; overrides configuration of both that subtopology and a framework one.
[fprime]
framework_path: ../../lib/fprime
project_root: .
library_locations: ../../lib/fprime-vxworks:lib/sensor-lib
default_toolchain: vxworks
default_cmake_options: FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
    VX_TARGET_TYPE=DKM
    FPRIME_PLATFORM=VxWorks
