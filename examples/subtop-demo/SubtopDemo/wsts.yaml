# WSTS manifest for SubtopDemo, a VxWorks deployment built from subtopologies.
#
# Nothing here names the UART driver: it is inside the SensorLink subtopology of
# lib/sensor-lib, and is found and replaced from the surrogate catalog like a driver in the
# deployment's own Top. Its qualified name is SensorLink.uart; the base name `uart` is
# enough wherever it is unambiguous, as in the endpoint below.
deployment: SubtopDemo

keep:
  - comDriver

models:
  - name: tempSensor
    class: Wsts::ScriptedByteStream
    endpoint: uart
    kind: bytestream
    params:
      text: "$TEMP,21.5\n"
      period: "10"

bridge: tcp:50102
