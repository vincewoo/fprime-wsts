; WSTS toolkit example: the flight software of a spacecraft with two computers.
;
;   Cdh      the command and data handling computer, a VxWorks downloadable kernel module.
;            The default toolchain below builds it.
;   Payload  a Linux single-board computer, built with that board's own toolchain.
;
; Neither can be configured or built on a plain Linux host. The simulated system generated
; from examples/mission-sim builds and runs there.
[fprime]
framework_path: ../../lib/fprime
project_root: .
library_locations: ../../lib/fprime-vxworks:lib/sensor-lib
default_toolchain: vxworks
default_cmake_options: FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
    VX_TARGET_TYPE=DKM
    FPRIME_PLATFORM=VxWorks
